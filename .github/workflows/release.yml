name: Release

# Builds desktop installers for all OSes on every merge to main and attaches
# them to a PUBLISHED GitHub Release tagged app-v<version> (version from
# src-tauri/tauri.conf.json). The release goes LIVE on merge — there is no
# manual publish step, so whatever lands on main ships.
#
# The `prepare` job keeps an existing release AND its tag and clears only its
# assets, so a re-run at an unchanged version re-uploads cleanly (that is all
# that was needed to dodge tauri-action's "ReleaseAsset already_exists") without
# breaking the public download links of a release that is already out. Bump
# `version` for each new release.
#
# This is a build-only game (no web target). Artifacts per release:
#   macOS  — .dmg (Apple Silicon)            [scripts/make-dmg.mjs]
#   Windows — NSIS installer (.exe) + a portable one-click .exe ("noinstall")
#   Linux  — .deb + .AppImage
# Mobile (iOS/Android) is intentionally omitted: it needs signing secrets
# (Apple cert + provisioning profile / Android keystore) — add a separate
# workflow once those are configured.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

# Serialize runs so two quick merges can't race on the same tag. Queue (don't
# cancel) — a cancelled mid-release run would leave a published release with only
# some of its installers attached.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Make sure a PUBLISHED release exists for this version before the matrix
  # uploads into it.
  #
  # This used to delete + recreate the release every run, which was safe while
  # everything was a draft. It is not safe now: a published release and its tag
  # are public links, and deleting them on a re-run would break every existing
  # download. So an existing release is KEPT (tag and all) and only its assets
  # are cleared, which is all that was ever needed to avoid tauri-action's
  # "ReleaseAsset already_exists" on a second run.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create or reset the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="app-v${{ steps.meta.outputs.version }}"
          title="Little Apartment, Big City v${{ steps.meta.outputs.version }}"
          notes="Automated build from main (commit ${GITHUB_SHA:0:7})."
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - clearing its assets and re-publishing."
            for asset in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
              echo "  removing stale asset: $asset"
              gh release delete-asset "$tag" "$asset" --yes
            done
            # --draft=false publishes it if a previous run left it as a draft.
            gh release edit "$tag" --title "$title" --notes "$notes" --draft=false
          else
            gh release create "$tag" \
              --title "$title" \
              --notes "$notes" \
              --target "$GITHUB_SHA"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple Silicon only (aarch64)
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
          - platform: ubuntu-22.04      # 22.04 has the webkit2gtk-4.1 packages Tauri v2 needs
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libudev-dev

      - name: Install npm dependencies
        run: npm ci

      # tauri-action runs `beforeBuildCommand` (npm run build) then `tauri build`,
      # bundles the installers, and uploads them to the release named below.
      # macOS dmg is intentionally NOT in bundle.targets (Tauri's bundle_dmg.sh
      # is flaky headless) — built + uploaded by the next step instead.
      - name: Build & release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__         # __VERSION__ <- src-tauri/tauri.conf.json
          releaseName: "Little Apartment, Big City v__VERSION__"
          releaseBody: "Automated build from main."
          releaseDraft: false      # publish on merge to main, no manual step
          prerelease: false
          args: ${{ matrix.args }}

      # Build the macOS dmg deterministically (hdiutil, no AppleScript) and add
      # it to the exact release this job just populated. Upload by releaseId
      # (not by tag) so another release sharing the tag can't divert the asset.
      - name: Build & upload macOS dmg
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/make-dmg.mjs
          dmg="$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets?name=$(basename "$dmg")" \
            --input "$dmg"

      # Portable "noinstall" build: the raw Tauri exe runs with no installer —
      # double-click to play (needs the WebView2 runtime, preinstalled on
      # Windows 11). Handy for quick testing without committing to an install.
      - name: Upload Windows portable exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe="src-tauri/target/release/little-apartment.exe"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets?name=LittleApartmentBigCity-noinstall.exe" \
            --input "$exe"
