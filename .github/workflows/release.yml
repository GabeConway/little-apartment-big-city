name: Release

# Builds desktop installers for all OSes on every merge to main and
# attaches them to a DRAFT GitHub Release tagged app-v<version> (version from
# src-tauri/tauri.conf.json). The `prepare` job RESETS that draft each run
# (delete + recreate) so re-running at an unchanged version starts from a clean
# release — otherwise tauri-action's asset upload fails with
# "ReleaseAsset already_exists". Bump `version` to keep a release permanently.
#
# This is a build-only game (no web target). Artifacts per release:
#   macOS  — .dmg (Apple Silicon)            [scripts/make-dmg.mjs]
#   Windows — NSIS installer (.exe) + a portable one-click .exe ("noinstall")
#   Linux  — .deb + .AppImage
# Mobile (iOS/Android) is intentionally omitted: it needs signing secrets
# (Apple cert + provisioning profile / Android keystore) — add a separate
# workflow once those are configured.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

# Serialize runs so two quick merges can't race to create duplicate draft
# releases for the same tag. Queue (don't cancel) — a cancelled mid-release
# run would leave a half-populated draft.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Reset the draft release once per run so the matrix uploads into a clean
  # release (no stale same-named assets). Runs before the build matrix.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: Reset draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="app-v${{ steps.meta.outputs.version }}"
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" --draft \
            --title "Little Apartment, Big City v${{ steps.meta.outputs.version }}" \
            --notes "Automated build from main (commit ${GITHUB_SHA:0:7})." \
            --target "$GITHUB_SHA"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple Silicon only (aarch64)
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
          - platform: ubuntu-22.04      # 22.04 has the webkit2gtk-4.1 packages Tauri v2 needs
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libudev-dev

      - name: Install npm dependencies
        run: npm ci

      # tauri-action runs `beforeBuildCommand` (npm run build) then `tauri build`,
      # bundles the installers, and uploads them to the release named below.
      # macOS dmg is intentionally NOT in bundle.targets (Tauri's bundle_dmg.sh
      # is flaky headless) — built + uploaded by the next step instead.
      - name: Build & release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__         # __VERSION__ <- src-tauri/tauri.conf.json
          releaseName: "Little Apartment, Big City v__VERSION__"
          releaseBody: "Automated build from main."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Build the macOS dmg deterministically (hdiutil, no AppleScript) and add
      # it to the exact release this job just populated. Upload by releaseId
      # (not by tag) so a duplicate draft sharing the tag can't divert the asset.
      - name: Build & upload macOS dmg
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/make-dmg.mjs
          dmg="$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets?name=$(basename "$dmg")" \
            --input "$dmg"

      # Portable "noinstall" build: the raw Tauri exe runs with no installer —
      # double-click to play (needs the WebView2 runtime, preinstalled on
      # Windows 11). Handy for quick testing without committing to an install.
      - name: Upload Windows portable exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe="src-tauri/target/release/little-apartment.exe"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets?name=LittleApartmentBigCity-noinstall.exe" \
            --input "$exe"
