version: 2

# Day-to-day work lands on DEV (see CLAUDE.md "Git workflow"), so Dependabot
# targets DEV rather than the default branch — its PRs merge where everything
# else does, and `main` stays a promotion of a branch that already passed CI.
#
# Tuned for low noise: monthly, grouped into one PR per ecosystem, small open-PR
# caps.
#
# NOTE: Dependabot ALERTS are currently DISABLED on this repository (the API
# returns 403 "Dependabot alerts are disabled"), and alerts/security updates are
# a repo setting, not something this file controls. So security advisories do
# NOT arrive on their own - the scheduled version bumps below are the only thing
# Dependabot does here, and `npm audit` is the only advisory signal. See
# kb/conventions.md "Outstanding advisories".

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: DEV
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # The whole toolchain is devDependencies — nothing here ships in the game
      # binary, so batching it into one PR is safe and keeps the queue short.
      dev-toolchain:
        dependency-type: development
        update-types: [minor, patch]
      # React is the game's only runtime dependency (src/game/ is React-only by
      # invariant). Majors stay out of the group so they land on their own.
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: DEV
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      rust:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    target-branch: DEV
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(ci)
