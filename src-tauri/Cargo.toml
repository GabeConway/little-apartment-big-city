[package]
name = "little-apartment"
version = "1.0.0"
description = "Little Apartment, Big City"
authors = ["Gabe Conway"]
edition = "2021"
rust-version = "1.77.2"

# The `_lib` suffix lets the desktop and mobile entry points share one library.
[lib]
name = "little_apartment_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
