[package]
name = "little-apartment"
version = "1.3.0"
description = "Little Apartment, Big City"
authors = ["Gabe Conway"]
edition = "2021"
rust-version = "1.77.2"

# The `_lib` suffix lets the desktop and mobile entry points share one library.
[lib]
name = "little_apartment_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native gamepad bridge (desktop only). The webview Gamepad API is unreliable in
# WebView2 (Windows) and WebKitGTK (Linux/Steam Deck); gilrs reads pads via
# XInput / evdev / IOKit and we polyfill navigator.getGamepads() from it.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
gilrs = "0.11"
